<div *ngIf="isOpen" class="fixed inset-0 z-[150] flex items-center justify-center p-4 md:p-8 lg:p-12 overflow-hidden">
  <!-- Backdrop -->
  <div (click)="close.emit()" class="absolute inset-0 bg-black/95 backdrop-blur-3xl transition-all duration-700"></div>

  <!-- Modal Content Container -->
  <div 
    [@modalFade]
    class="relative w-full max-w-[1300px] h-full max-h-full md:max-h-[90vh] bg-[#0a0a0a] border border-gold/20 flex flex-col md:flex-row overflow-hidden shadow-[0_0_100px_rgba(0,0,0,1)]"
  >
    <!-- Close Button (Fixed relative to the modal window) -->
    <button (click)="close.emit()" class="absolute top-6 right-6 text-gold/30 hover:text-gold transition-all duration-300 z-[60] bg-black/40 backdrop-blur-md p-2 rounded-full border border-gold/10 hover:border-gold/40">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- 1️⃣ Main Visual Area -->
    <div class="w-full md:w-[55%] h-[60vh] md:h-full bg-[#050505] flex flex-col items-center justify-center relative group overflow-hidden border-b md:border-b-0 md:border-r border-gold/10">
      <!-- Artwork in Context (Background) -->
      <div class="absolute inset-0 opacity-15 transition-all duration-1000 group-hover:opacity-30 pointer-events-none">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent z-10"></div>
        <img src="assets/about.png" class="w-full h-full object-cover scale-110 blur-[4px]" alt="Gallery Wall">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-gold/5 rounded-full blur-[150px]"></div>
      </div>

      <!-- Main Visual with Gold Frame -->
      <div class="relative w-full h-full flex items-center justify-center p-12 md:p-24 lg:p-32 z-20">
        <div class="relative p-3 bg-black shadow-[0_50px_100px_-20px_rgba(0,0,0,1)] group/frame transition-transform duration-1000">
          <!-- Gold Frame Accents -->
          <div class="absolute inset-0 border-[0.5px] border-gold/40"></div>
          <div class="absolute -inset-1 border-[0.5px] border-gold/15"></div>
          
          <img 
            [src]="selectedVariant.image" 
            [alt]="productName" 
            class="max-w-full max-h-[40vh] md:max-h-[60vh] object-contain transition-all duration-[2000ms] group-hover/frame:scale-[1.02] block mx-auto"
          >
          
          <!-- Subtle Shadowing (Bottom glow) -->
          <div class="absolute -bottom-10 left-10 right-10 h-10 bg-black/60 blur-3xl rounded-full"></div>
        </div>

        <!-- Label Overlay -->
        <div class="absolute bottom-8 left-8 md:bottom-12 md:left-12 group-hover:translate-x-2 transition-transform duration-700 pointer-events-none">
            <div class="text-gold/30 text-[7px] md:text-[8px] uppercase tracking-[0.4em] mb-1">Institutional Archive Selection</div>
            <div class="text-white/30 font-serif text-[9px] md:text-[10px] tracking-widest uppercase italic font-light">{{ productName }}</div>
        </div>
      </div>
    </div>

    <!-- 2️⃣ & 4️⃣ Product Information & Variants (Always scrollable) -->
    <div class="flex-1 h-full overflow-y-auto custom-scrollbar bg-[#080808] p-8 md:p-12 lg:p-20">
      <div class="max-w-md mx-auto flex flex-col min-h-full">
        <div class="mb-12">
          <h3 class="text-gold/50 text-[10px] uppercase tracking-[0.5em] mb-4 font-light">{{ artistName }}</h3>
          <h2 class="text-white font-serif text-4xl md:text-5xl lg:text-6xl tracking-tight mb-8 leading-tight">{{ productName }}</h2>
          <div class="w-20 h-[1px] bg-gold/20 mb-8"></div>
          <p class="text-neutral-400 font-sans text-sm md:text-base leading-relaxed tracking-wide italic font-light">
            {{ productDescription }}
          </p>
        </div>

        <!-- Selection Section -->
        <div class="mb-12">
          <div class="text-gold/40 text-[9px] uppercase tracking-[0.4em] mb-6 border-l border-gold/20 pl-4">Institutional Options</div>
          <div class="grid grid-cols-1 gap-4">
            <button 
              *ngFor="let variant of variants"
              (click)="selectVariant(variant)"
              [class.border-gold/60]="selectedVariant === variant"
              [class.bg-gold/[0.03]]="selectedVariant === variant"
              class="group p-5 border border-gold/10 hover:border-gold/30 transition-all duration-500 text-left flex justify-between items-center bg-black/20"
            >
              <div>
                <div class="text-[10px] text-white/90 uppercase tracking-[0.2em] mb-1 font-medium group-hover:text-white">{{ variant.name }}</div>
                <div class="text-[11px] text-neutral-500 font-sans tracking-wide">{{ variant.size }}</div>
              </div>
              <div class="text-gold font-serif text-sm md:text-base opacity-70 group-hover:opacity-100 transition-opacity">
                {{ variant.price }}
              </div>
            </button>
          </div>
        </div>

        <!-- Add to Cart (only if logged in) -->
        <div class="mt-auto pt-12">
          <button 
            (click)="addToCart()"
            [disabled]="!authService.isAuthenticated()"
            class="w-full py-6 border border-gold/30 group/btn overflow-hidden relative transition-all duration-700 disabled:opacity-20 disabled:grayscale disabled:cursor-not-allowed"
          >
            <div class="absolute inset-0 bg-gold translate-y-full group-hover/btn:translate-y-0 transition-transform duration-700"></div>
            <span class="relative z-10 text-gold text-[10px] uppercase tracking-[0.6em] group-hover/btn:text-black transition-colors duration-500 font-sans font-bold">
              {{ authService.isAuthenticated() ? 'Acquire for Collection' : 'Identification Required' }}
            </span>
          </button>
          <p *ngIf="!authService.isAuthenticated()" class="text-center mt-6 text-[8px] text-gold/30 uppercase tracking-[0.4em] leading-loose">
              Access is restricted to verified collectors. <br> Please authenticate your identity.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
