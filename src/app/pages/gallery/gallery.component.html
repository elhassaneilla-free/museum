<section class="min-h-screen bg-black pt-32 pb-24 px-6 md:px-12 lg:px-24">
  <!-- Header / Intro (Optional but helps the calm atmosphere) -->
  <div class="max-w-7xl mx-auto mb-16 text-center">
    <h1 class="font-['Playfair_Display'] text-4xl md:text-5xl text-[#c6a664] tracking-widest uppercase mb-4 opacity-90">
      The Exhibition
    </h1>
    <div class="w-24 h-px bg-[#c6a664]/40 mx-auto"></div>
  </div>

  <!-- Artist Grid (2 x 3 on medium and above) -->
  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
    <div *ngFor="let artist of artists; let i = index" 
         [routerLink]="artist.route"
         [class.lg:col-start-2]="i === 6"
         class="group relative h-[500px] overflow-hidden cursor-pointer border border-[#c6a664]/10 bg-neutral-900/50 backdrop-blur-sm">
      
      <!-- Artist Image Background -->
      <div class="absolute inset-0 z-0">
        <img [src]="artist.image" 
             [alt]="artist.name" 
             class="w-full h-full object-cover transition-all duration-[1500ms] ease-out group-hover:scale-110 group-hover:blur-[4px]">
      </div>

      <!-- Dark Overlay Fades In on Hover -->
      <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-1000 ease-in-out z-10"></div>

      <!-- Glassmorphism Frame (Subtle border/tint) -->
      <div class="absolute inset-0 border border-[#c6a664]/20 group-hover:border-[#c6a664]/40 transition-colors duration-1000 z-20"></div>

      <!-- Artist Name Dramatic Appearance -->
      <div class="absolute inset-0 flex flex-col items-center justify-center z-30 opacity-0 transform scale-95 group-hover:opacity-100 group-hover:scale-100 transition-all duration-1000 ease-out">
        <h2 class="font-['Playfair_Display'] text-[#c6a664] text-3xl md:text-4xl text-center px-6 leading-tight tracking-wide drop-shadow-2xl">
          {{ artist.name }}
        </h2>
        <div class="mt-4 w-12 h-px bg-[#c6a664]/60 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-1000 delay-300"></div>
      </div>

      <!-- Subtle bottom info (Static/Atmospheric) -->
      <div class="absolute bottom-8 left-0 right-0 text-center z-30 opacity-80 group-hover:opacity-0 transition-opacity duration-500">
        <span class="font-['Inter'] text-neutral-400 text-[10px] uppercase tracking-[0.4em]">Explore Collection</span>
      </div>
    </div>
  </div>
</section>
