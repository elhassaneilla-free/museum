<nav
  class="fixed top-0 left-0 w-full z-50 h-[80px] flex items-center bg-black/40 backdrop-blur-xl border-b border-[#c6a664]/10 shadow-[0_4px_30px_rgba(0,0,0,0.5)] px-6 md:px-12 transition-all duration-300"
>
  <!-- Logo -->
  <a
    routerLink="/"
    class="absolute left-6 md:left-12 top-1/2 -translate-y-1/2 group transition-all duration-300 flex items-center space-x-5"
  >
    <img src="/assets/logo.png" alt="VICTORIA Logo" class="h-10 w-auto object-contain drop-shadow-[0_0_10px_rgba(198,166,100,0.3)] group-hover:drop-shadow-[0_0_15px_rgba(198,166,100,0.5)] transition-all" />
    <span class="font-['Cinzel'] font-bold text-[#c6a664] text-xl uppercase tracking-[0.3em] pt-1 select-none drop-shadow-sm">VICTORIA</span>
  </a>

  <!-- Navigation Links (Centered) -->
  <ul
    #navLinks
    class="mx-auto flex justify-center items-center space-x-12 sm:space-x-16 lg:space-x-24"
  >
    <li>
      <a
        routerLink="/"
        class="group relative cursor-pointer font-['Inter'] text-[#c6a664]/80 text-[11px] uppercase tracking-[0.3em] transition-all duration-500 hover:text-[#c6a664]"
      >
        <span class="relative z-10 font-bold">Home</span>
        <span class="absolute -bottom-1 left-1/2 w-0 h-[1px] bg-[#c6a664] -translate-x-1/2 transition-all duration-500 group-hover:w-full group-hover:shadow-[0_0_8px_rgba(198,166,100,0.5)]"></span>
      </a>
    </li>
    <li>
      <a
        routerLink="/about"
        class="group relative cursor-pointer font-['Inter'] text-[#c6a664]/80 text-[11px] uppercase tracking-[0.3em] transition-all duration-500 hover:text-[#c6a664]"
      >
        <span class="relative z-10 font-bold">About</span>
        <span class="absolute -bottom-1 left-1/2 w-0 h-[1px] bg-[#c6a664] -translate-x-1/2 transition-all duration-500 group-hover:w-full group-hover:shadow-[0_0_8px_rgba(198,166,100,0.5)]"></span>
      </a>
    </li>
    <li>
      <a
        routerLink="/gallery"
        class="group relative cursor-pointer font-['Inter'] text-[#c6a664]/80 text-[11px] uppercase tracking-[0.3em] transition-all duration-500 hover:text-[#c6a664]"
      >
        <span class="relative z-10 font-bold">Gallery</span>
        <span class="absolute -bottom-1 left-1/2 w-0 h-[1px] bg-[#c6a664] -translate-x-1/2 transition-all duration-500 group-hover:w-full group-hover:shadow-[0_0_8px_rgba(198,166,100,0.5)]"></span>
      </a>
    </li>
  </ul>

  <!-- Cart & Login / Logout -->
  <div class="absolute right-6 md:right-12 top-1/2 -translate-y-1/2 flex items-center space-x-6 md:space-x-8">
    <!-- Cart Icon -->
    <a 
      *ngIf="authService.isAuthenticated()"
      routerLink="/cart"
      class="group relative p-2 flex items-center justify-center transition-all duration-500"
    >
      <div class="w-10 h-10 flex items-center justify-center border border-[#c6a664]/60 rounded-full bg-black/60 group-hover:bg-[#c6a664]/20 group-hover:border-[#c6a664] group-hover:shadow-[0_0_15px_rgba(198,166,100,0.5)] transition-all duration-500">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-[#c6a664]">
          <path d="M9 20C9 21.1046 8.10457 22 7 22C5.89543 22 5 21.1046 5 20C5 18.8954 5.89543 18 7 18C8.10457 18 9 18.8954 9 20Z" />
          <path d="M20 20C20 21.1046 19.1046 22 18 22C16.8954 22 16 21.1046 16 20C16 18.8954 16.8954 18 18 18C19.1046 18 20 18.8954 20 20Z" />
          <path d="M1 1H5L7.68 14.39C7.77144 14.8504 8.02191 15.264 8.38755 15.5583C8.75318 15.8526 9.2107 16.009 9.68 16H19.4C19.8693 16.009 20.3268 15.8526 20.6925 15.5583C21.0581 15.264 21.3086 14.8504 21.4 14.39L23 6H6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <!-- Cart Badge -->
      <div 
        *ngIf="cartService.getTotalCount() > 0"
        class="absolute -top-1 -right-1 w-5 h-5 bg-[#c6a664] rounded-full flex items-center justify-center text-[10px] text-black font-bold shadow-[0_0_10px_rgba(198,166,100,0.5)] animate-in fade-in zoom-in duration-300"
      >
        {{ cartService.getTotalCount() }}
      </div>
    </a>

    <!-- Login / Logout Icon -->
    <button 
      (click)="authService.isAuthenticated() ? onLogout() : toggleLogin()"
      class="group p-2 flex items-center space-x-3 text-[#c6a664] hover:text-[#ffd700] transition-all duration-500 cursor-pointer"
    >
      <div class="w-10 h-10 flex items-center justify-center border border-[#c6a664]/40 rounded-full group-hover:border-[#c6a664] transition-all duration-500 bg-black/40">
        <svg *ngIf="!authService.isAuthenticated()" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.5901 22C20.5901 18.13 16.7401 15 12.0001 15C7.2601 15 3.4101 18.13 3.4101 22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg *ngIf="authService.isAuthenticated()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="hidden md:block font-['Inter'] text-[10px] uppercase tracking-[0.3em] text-[#c6a664] opacity-80 group-hover:opacity-100 transition-opacity font-bold">
        {{ authService.isAuthenticated() ? authService.currentUser()?.username : 'Access' }}
      </span>
    </button>
  </div>
</nav>

<!-- Login Modal Overlay -->
<div 
  *ngIf="isLoginOpen"
  class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-6"
>
  <!-- Transparent Backdrop -->
  <div (click)="toggleLogin()" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-all duration-500"></div>

  <!-- Split Modal Content -->
  <div class="relative w-full max-w-[900px] bg-[#0a0a0a] backdrop-blur-3xl border border-[#c6a664]/30 shadow-[0_40px_120px_rgba(0,0,0,0.9)] overflow-hidden animate-in fade-in zoom-in duration-700">
    
    <!-- Premium Decorative Accents -->
    <div class="absolute top-0 left-0 w-12 h-12 border-t border-l border-[#c6a664]/60"></div>
    <div class="absolute bottom-0 right-0 w-12 h-12 border-b border-r border-[#c6a664]/60"></div>
    
    <div class="flex flex-col md:flex-row">
      <!-- LEFT PANEL: LOGIN -->
      <div class="w-full md:w-1/2 p-10 md:p-14 border-r border-[#c6a664]/10 bg-gradient-to-br from-black/80 to-black/40">
        <div class="relative z-10 text-center mb-12">
          <h2 class="font-serif text-2xl md:text-3xl text-[#c6a664] tracking-[0.3em] uppercase mb-4 font-light drop-shadow-md">
            Identity
          </h2>
          <div class="w-12 h-px bg-[#c6a664]/60 mx-auto mb-4"></div>
          <p class="font-['Cinzel'] text-[9px] text-neutral-400 uppercase tracking-[0.6em] italic font-bold">The Vault Access</p>
        </div>

        <form (ngSubmit)="onLogin()" class="relative z-10 space-y-8">
          <div class="relative group/field">
            <label class="block font-sans text-[9px] uppercase tracking-[0.4em] text-[#c6a664] mb-2 group-focus-within/field:text-[#ffd700] transition-colors font-bold">Access Key</label>
            <input 
              type="text" 
              name="username"
              [(ngModel)]="username"
              class="w-full bg-transparent border-b border-[#c6a664]/20 py-3 font-sans text-sm text-white focus:outline-none focus:border-[#c6a664] transition-all duration-500 placeholder-neutral-600"
            >
          </div>
          
          <div class="relative group/field">
            <label class="block font-sans text-[9px] uppercase tracking-[0.4em] text-[#c6a664] mb-2 group-focus-within/field:text-[#ffd700] transition-colors font-bold">Security Code</label>
            <input 
              type="password" 
              name="password"
              [(ngModel)]="password"
              class="w-full bg-transparent border-b border-[#c6a664]/20 py-3 font-sans text-sm text-white focus:outline-none focus:border-[#c6a664] transition-all duration-500 placeholder-neutral-600"
            >
          </div>

          <div *ngIf="error" class="text-red-400 text-[10px] uppercase tracking-widest text-center animate-pulse pt-2 font-bold">
            {{ error }}
          </div>

          <button 
            type="submit"
            class="w-full py-5 border border-[#c6a664]/30 font-['Cinzel'] text-[10px] text-[#c6a664] uppercase tracking-[0.6em] transition-all duration-700 hover:bg-[#c6a664] hover:text-black overflow-hidden relative group/btn font-bold shadow-[0_0_20px_rgba(198,166,100,0.1)] hover:shadow-[0_0_30px_rgba(198,166,100,0.4)]"
          >
            Authenticate
          </button>
        </form>
      </div>

      <!-- RIGHT PANEL: INSCRIPTION (REGISTER) -->
      <div class="w-full md:w-1/2 p-10 md:p-14 bg-[#c6a664]/[0.03]">
        <div class="relative z-10 text-center mb-12">
          <h2 class="font-serif text-2xl md:text-3xl text-[#c6a664]/90 tracking-[0.3em] uppercase mb-4 font-light drop-shadow-sm">
            Inscription
          </h2>
          <div class="w-12 h-px bg-[#c6a664]/40 mx-auto mb-4"></div>
          <p class="font-['Cinzel'] text-[9px] text-neutral-400 uppercase tracking-[0.6em] italic font-bold">Enlist as Collector</p>
        </div>

        <form class="relative z-10 space-y-6">
          <div class="relative group/field">
            <label class="block font-sans text-[9px] uppercase tracking-[0.4em] text-[#c6a664]/80 mb-1 font-bold">Full Representative Name</label>
            <input 
              type="text" 
              name="regFullname"
              [(ngModel)]="regFullname"
              class="w-full bg-transparent border-b border-[#c6a664]/20 py-2 font-sans text-sm text-neutral-200 focus:outline-none focus:border-[#c6a664]/60 transition-all font-medium"
            >
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div class="relative group/field">
              <label class="block font-sans text-[9px] uppercase tracking-[0.4em] text-[#c6a664]/80 mb-1 font-bold">Username</label>
              <input 
                type="text" 
                name="regUsername"
                [(ngModel)]="regUsername"
                class="w-full bg-transparent border-b border-[#c6a664]/20 py-2 font-sans text-sm text-neutral-200 focus:outline-none focus:border-[#c6a664]/60 transition-all font-medium"
              >
            </div>
            <div class="relative group/field">
              <label class="block font-sans text-[9px] uppercase tracking-[0.4em] text-[#c6a664]/80 mb-1 font-bold">Email</label>
              <input 
                type="email" 
                name="regEmail"
                [(ngModel)]="regEmail"
                class="w-full bg-transparent border-b border-[#c6a664]/20 py-2 font-sans text-sm text-neutral-200 focus:outline-none focus:border-[#c6a664]/60 transition-all font-medium"
              >
            </div>
          </div>
          
          <div class="relative group/field">
            <label class="block font-sans text-[9px] uppercase tracking-[0.4em] text-[#c6a664]/80 mb-1 font-bold">Establish Security Key</label>
            <input 
              type="password" 
              name="regPassword"
              [(ngModel)]="regPassword"
              class="w-full bg-transparent border-b border-[#c6a664]/20 py-2 font-sans text-sm text-neutral-200 focus:outline-none focus:border-[#c6a664]/60 transition-all font-medium"
            >
          </div>

          <div class="relative group/field">
            <label class="block font-sans text-[9px] uppercase tracking-[0.4em] text-[#c6a664]/80 mb-1 font-bold">Confirm Security Key</label>
            <input 
              type="password" 
              name="regConfirmPassword"
              [(ngModel)]="regConfirmPassword"
              class="w-full bg-transparent border-b border-[#c6a664]/20 py-2 font-sans text-sm text-neutral-200 focus:outline-none focus:border-[#c6a664]/60 transition-all font-medium"
            >
          </div>

          <button 
            type="button"
            (click)="isRegistering = true"
            class="w-full py-5 border border-[#c6a664]/20 font-['Cinzel'] text-[10px] text-[#c6a664] uppercase tracking-[0.5em] transition-all duration-700 hover:border-[#c6a664] hover:text-[#ffd700] hover:bg-[#c6a664]/10 mt-4 font-bold"
          >
            Create Account
          </button>
        </form>

        <div *ngIf="isRegistering" class="mt-4 text-center animate-pulse">
           <span class="text-[9px] text-green-400 uppercase tracking-widest italic font-bold">Institutional Verification Pending...</span>
        </div>
      </div>
    </div>

    <!-- Close Button -->
    <button (click)="toggleLogin()" class="absolute top-6 right-6 text-[#c6a664]/40 hover:text-[#c6a664] transition-all duration-300 z-50">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div>
</div>
