<div *ngIf="isOpen" class="fixed inset-0 z-[150] flex items-center justify-center p-4 md:p-8 lg:p-12 overflow-hidden">
  <!-- Backdrop -->
  <div (click)="close.emit()" class="absolute inset-0 bg-black/95 backdrop-blur-3xl transition-all duration-700"></div>

  <!-- Modal Content Container -->
  <div 
    [@modalFade]
    class="relative w-full max-w-[1300px] h-full max-h-full md:max-h-[90vh] bg-[#0a0a0a] border-2 border-gold/30 flex flex-col md:flex-row overflow-hidden shadow-[0_0_120px_rgba(0,0,0,1)]"
  >
    <!-- Close Button -->
    <button (click)="close.emit()" class="absolute top-6 right-6 text-gold hover:text-white transition-all duration-300 z-[60] bg-black/60 backdrop-blur-md p-3 rounded-full border border-gold/20 hover:border-gold/60 shadow-lg">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- 1️⃣ Main Visual Area -->
    <div class="w-full md:w-[55%] h-[60vh] md:h-full bg-[#050505] flex flex-col items-center justify-center relative group overflow-hidden border-b md:border-b-0 md:border-r border-gold/20">
      <!-- Artwork in Context (Background) -->
      <div class="absolute inset-0 opacity-20 transition-all duration-1000 group-hover:opacity-40 pointer-events-none">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent z-10"></div>
        <img src="assets/about.png" class="w-full h-full object-cover scale-110 blur-[6px] grayscale-[0.5]" alt="Gallery Wall">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-gold/10 rounded-full blur-[150px]"></div>
      </div>

      <!-- Main Visual with Gold Frame -->
      <div class="relative w-full h-full flex items-center justify-center p-12 md:p-24 lg:p-32 z-20">
        <div class="relative p-4 bg-black shadow-[0_60px_120px_-30px_rgba(0,0,0,1)] group/frame transition-transform duration-1000">
          <!-- Gold Frame Accents -->
          <div class="absolute inset-0 border-2 border-gold/40 shadow-[inset_0_0_20px_rgba(0,0,0,1)]"></div>
          <div class="absolute -inset-1.5 border border-gold/20 opacity-60"></div>
          
          <img 
            [src]="selectedVariant.image" 
            [alt]="productName" 
            class="max-w-full max-h-[40vh] md:max-h-[60vh] object-contain transition-all duration-[2000ms] group-hover/frame:scale-[1.03] block mx-auto opacity-95 group-hover/frame:opacity-100 shadow-2xl"
          >
          
          <!-- Subtle Shadowing (Bottom glow) -->
          <div class="absolute -bottom-12 left-10 right-10 h-12 bg-black/80 blur-3xl rounded-full"></div>
        </div>

        <!-- Label Overlay -->
        <div class="absolute bottom-8 left-8 md:bottom-12 md:left-12 group-hover:translate-x-4 transition-transform duration-1000 pointer-events-none">
            <div class="text-gold text-[10px] md:text-[11px] uppercase tracking-[0.5em] mb-2 font-bold drop-shadow-md opacity-80">Institutional Archive Selection</div>
            <div class="text-white font-serif text-[11px] md:text-[13px] tracking-widest uppercase italic font-light drop-shadow-md opacity-60 group-hover:opacity-90">{{ productName }}</div>
        </div>
      </div>
    </div>

    <!-- 2️⃣ & 4️⃣ Product Information & Variants -->
    <div class="flex-1 h-full overflow-y-auto custom-scrollbar bg-[#080808] p-8 md:p-12 lg:p-20 relative">
      <!-- Fine Texture -->
      <div class="absolute inset-0 pointer-events-none opacity-[0.03] grayscale brightness-125" style="background-image: url('https://grainy-gradients.vercel.app/noise.svg');"></div>
      
      <div class="relative z-10 max-w-md mx-auto flex flex-col min-h-full">
        <div class="mb-14">
          <h3 class="text-gold text-[11px] uppercase tracking-[0.6em] mb-4 font-bold drop-shadow-sm">{{ artistName }}</h3>
          <h2 class="text-white font-serif text-4xl md:text-5xl lg:text-7xl tracking-tight mb-10 leading-[1.1] italic drop-shadow-lg">{{ productName }}</h2>
          <div class="w-24 h-px bg-gold/40 mb-10 shadow-[0_0_10px_rgba(198,166,100,0.3)]"></div>
          <p class="text-neutral-200 font-sans text-base md:text-lg leading-relaxed tracking-wide italic font-light drop-shadow-sm">
            {{ productDescription }}
          </p>
        </div>

        <!-- Selection Section -->
        <div class="mb-14">
          <div class="text-gold text-[10px] uppercase tracking-[0.5em] mb-8 border-l-2 border-gold/40 pl-5 font-bold drop-shadow-sm">Institutional Options</div>
          <div class="grid grid-cols-1 gap-5">
            <button 
              *ngFor="let variant of variants"
              (click)="selectVariant(variant)"
              [class.border-gold]="selectedVariant === variant"
              [class.bg-gold/10]="selectedVariant === variant"
              class="group p-6 border-2 border-gold/20 hover:border-gold transition-all duration-700 text-left flex justify-between items-center bg-black/40 shadow-md"
            >
              <div>
                <div class="text-[11px] text-white uppercase tracking-[0.3em] mb-1 font-bold group-hover:text-gold transition-colors">{{ variant.name }}</div>
                <div class="text-[12px] text-neutral-400 font-sans tracking-wide font-medium">{{ variant.size }}</div>
              </div>
              <div class="text-gold font-serif text-lg md:text-xl font-bold drop-shadow-sm">
                {{ variant.price }}
              </div>
            </button>
          </div>
        </div>

        <!-- Add to Cart (only if logged in) -->
        <div class="mt-auto pt-12">
          <button 
            (click)="addToCart()"
            [disabled]="!authService.isAuthenticated()"
            class="group/btn relative w-full py-6 overflow-hidden transition-all duration-1000 ease-out border-2 border-gold/40 hover:border-gold bg-black/40 backdrop-blur-sm disabled:opacity-20 disabled:grayscale disabled:cursor-not-allowed shadow-xl"
          >
            <!-- Button Background Fill -->
            <div class="absolute inset-x-0 bottom-0 h-0 bg-gold transition-all duration-700 group-hover/btn:h-full opacity-100"></div>
            
            <span class="relative z-10 font-['Cinzel'] text-[12px] uppercase tracking-[0.7em] text-gold group-hover/btn:text-black transition-colors duration-700 font-bold">
              {{ authService.isAuthenticated() ? 'Acquire for Collection' : 'Identification Required' }}
            </span>
            
            <!-- Subtle Glow -->
            <div class="absolute inset-0 opacity-0 group-hover/btn:opacity-100 transition-opacity duration-1000 shadow-[0_0_40px_rgba(198,166,100,0.5)]"></div>
          </button>
          <p *ngIf="!authService.isAuthenticated()" class="text-center mt-8 text-[10px] text-gold/60 uppercase tracking-[0.4em] leading-loose font-bold drop-shadow-sm">
              Access is restricted to verified collectors. <br> Please authenticate your identity.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
