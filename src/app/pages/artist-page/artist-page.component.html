<section class="min-h-screen bg-[#050505] pt-32 pb-24 px-6 md:px-12 lg:px-24">
  <!-- Return Button -->
  <a routerLink="/gallery" class="absolute top-32 left-6 md:left-12 lg:left-24 flex items-center group cursor-pointer z-40">
    <div class="relative w-10 h-10 flex items-center justify-center border-2 border-gold/40 rounded-full transition-all duration-500 group-hover:border-gold group-hover:bg-gold/10 group-hover:scale-110 shadow-lg">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-gold transition-colors duration-500">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <!-- Legend -->
      <span class="absolute left-14 font-['Cinzel'] text-[10px] text-gold uppercase tracking-[0.4em] opacity-0 group-hover:opacity-100 transition-opacity font-bold whitespace-nowrap drop-shadow-sm">Return to Gallery</span>
    </div>
  </a>

  <div class="max-w-7xl mx-auto" *ngIf="artist()">
    <!-- Artist Header -->
    <div class="text-center mb-24 animate-in fade-in slide-in-from-top-4 duration-1000">
      <h1 class="font-['Playfair_Display'] text-4xl md:text-6xl text-gold tracking-[0.2em] uppercase mb-4 opacity-100 drop-shadow-lg font-light italic">
        {{ artist()?.name }}
      </h1>
      <div class="w-32 h-px bg-gold/40 mx-auto mb-6 shadow-[0_0_10px_edge_rgba(198,166,100,0.5)]"></div>
      <p class="font-['Inter'] text-neutral-400 text-[11px] uppercase tracking-[0.6em] font-bold drop-shadow-sm">Private Exhibition Room</p>
    </div>

    <!-- 2x2 Grid -->
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-20 md:gap-x-20 md:gap-y-32">
      <div *ngFor="let painting of paintings()" class="group flex flex-col items-center">
        <!-- Painting Card -->
        <div 
          (click)="handlePaintingClick(painting)"
          class="relative flex flex-col items-center cursor-pointer"
        >
          
          <!-- Golden Frame -->
          <div class="relative p-3 border-2 border-gold/30 bg-black/40 backdrop-blur-sm transition-all duration-1000 group-hover:border-gold/60 group-hover:shadow-[0_0_50px_rgba(198,166,100,0.15)] shadow-2xl">
            
            <!-- Image Container -->
            <div [ngClass]="artist()?.layout === 'portrait' ? 'w-[300px] h-[380px] md:w-[360px] md:h-[460px]' : 'w-[320px] h-[220px] md:w-[460px] md:h-[320px]'" 
                 class="overflow-hidden relative bg-[#0a0a0a] transition-all duration-1000">
              
              <img [src]="painting.image" 
                   [alt]="painting.title" 
                   class="w-full h-full object-cover transition-transform duration-[3000ms] ease-out group-hover:scale-105 opacity-90 group-hover:opacity-100">
              
              <!-- Subtle inner shadow for museum depth -->
              <div class="absolute inset-0 shadow-[inset_0_0_60px_rgba(0,0,0,0.8)] pointer-events-none"></div>
            </div>

            <!-- Frame Ornaments (Corners) -->
            <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-gold/60"></div>
            <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-gold/60"></div>
            <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-gold/60"></div>
            <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-gold/60"></div>
          </div>

          <!-- Info Section -->
          <div class="mt-12 text-center flex flex-col items-center max-w-[300px] md:max-w-[360px]">
            <h2 class="font-serif text-gold text-3xl md:text-4xl mb-4 tracking-wide italic font-light drop-shadow-md">
              {{ painting.title }}
            </h2>
            
            <p class="font-sans text-neutral-300 text-[12px] leading-relaxed mb-8 opacity-90 tracking-wide line-clamp-2 italic font-light drop-shadow-sm">
              {{ painting.description }}
            </p>
            
            <div class="flex flex-col items-center gap-8">
              <span class="font-serif text-gold text-2xl tracking-[0.2em] font-light drop-shadow-md">
                {{ painting.price }}
              </span>
              
              <!-- Add to Cart Button -->
              <button 
                (click)="addToCart(painting, $event)"
                [disabled]="!authService.isAuthenticated()"
                class="group/btn relative px-14 py-4 overflow-hidden transition-all duration-1000 ease-out border-2 border-gold/40 hover:border-gold bg-black/40 backdrop-blur-sm disabled:opacity-20 disabled:cursor-not-allowed shadow-lg"
              >
                <!-- Button Background Fill -->
                <div class="absolute inset-x-0 bottom-0 h-0 bg-gold transition-all duration-700 group-hover/btn:h-full opacity-100"></div>
                
                <span class="relative z-10 font-['Cinzel'] text-[11px] uppercase tracking-[0.6em] text-gold group-hover/btn:text-black transition-colors duration-700 font-bold">
                  {{ authService.isAuthenticated() ? 'Add to Cart' : 'Restricted' }}
                </span>
                
                <!-- Subtle Glow -->
                <div class="absolute inset-0 opacity-0 group-hover/btn:opacity-100 transition-opacity duration-1000 shadow-[0_0_30px_rgba(198,166,100,0.4)]"></div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Luxury Modal -->
  <app-product-modal
    [isOpen]="isModalOpen"
    [artistName]="artist()?.name || 'Leonardo da Vinci'"
    [productName]="selectedPainting?.title || ''"
    [productDescription]="selectedPainting?.description || ''"
    [productMainImage]="selectedPainting?.image || ''"
    [productPrice]="selectedPainting?.price || ''"
    (close)="isModalOpen = false"
  ></app-product-modal>
</section>
