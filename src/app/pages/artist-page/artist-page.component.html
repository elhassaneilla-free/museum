<section class="min-h-screen bg-black pt-32 pb-24 px-6 md:px-12 lg:px-24">
  <!-- Return Button -->
  <a routerLink="/gallery" class="absolute top-32 left-6 md:left-12 lg:left-24 flex items-center group cursor-pointer z-40">
    <div class="relative w-8 h-8 flex items-center justify-center border border-gold/20 rounded-full transition-all duration-500 group-hover:border-gold/60 group-hover:scale-110">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-gold/60 transition-colors duration-500 group-hover:text-gold">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </a>

  <div class="max-w-7xl mx-auto" *ngIf="artist">
    <!-- Artist Header -->
    <div class="text-center mb-24 animate-fade-in">
      <h1 class="font-['Playfair_Display'] text-4xl md:text-5xl text-gold tracking-[0.2em] uppercase mb-4 opacity-90 drop-shadow-sm">
        {{ artist.name }}
      </h1>
      <div class="w-24 h-px bg-gold/30 mx-auto mb-6"></div>
      <p class="font-['Inter'] text-neutral-500 text-[10px] uppercase tracking-[0.5em] opacity-60">Private Exhibition Room</p>
    </div>

    <!-- 2x2 Grid -->
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-20 md:gap-x-20 md:gap-y-32">
      <div *ngFor="let painting of artist.paintings" class="group flex flex-col items-center">
        <!-- Painting Card -->
        <div class="relative flex flex-col items-center">
          
          <!-- Golden Frame -->
          <div class="relative p-2.5 border border-gold/20 bg-neutral-900/10 backdrop-blur-sm transition-all duration-1000 group-hover:border-gold/40 group-hover:shadow-[0_0_50px_rgba(198,166,100,0.08)]">
            
            <!-- Image Container -->
            <div [ngClass]="artist.layout === 'portrait' ? 'w-[300px] h-[380px] md:w-[360px] md:h-[460px]' : 'w-[320px] h-[220px] md:w-[460px] md:h-[320px]'" 
                 class="overflow-hidden relative bg-neutral-900 transition-all duration-1000">
              
              <img [src]="painting.image" 
                   [alt]="painting.name" 
                   class="w-full h-full object-cover transition-transform duration-[3000ms] ease-out group-hover:scale-105">
              
              <!-- Subtle inner shadow for museum depth -->
              <div class="absolute inset-0 shadow-[inset_0_0_40px_rgba(0,0,0,0.6)] pointer-events-none"></div>
            </div>

            <!-- Frame Ornaments (Corners) -->
            <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-gold/40"></div>
            <div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-gold/40"></div>
            <div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-gold/40"></div>
            <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-gold/40"></div>
          </div>

          <!-- Info Section -->
          <div class="mt-10 text-center flex flex-col items-center max-w-[300px] md:max-w-[360px]">
            <h2 class="font-serif text-gold text-2xl md:text-3xl mb-3 tracking-wide italic font-light drop-shadow-sm">
              {{ painting.name }}
            </h2>
            
            <p class="font-sans text-neutral-500 text-[11px] leading-relaxed mb-6 opacity-80 tracking-wide line-clamp-2 italic font-light">
              {{ painting.description }}
            </p>
            
            <div class="flex flex-col items-center gap-6">
              <span class="font-serif text-gold/80 text-lg tracking-[0.2em] font-light">
                {{ painting.price }}
              </span>
              
              <!-- Add to Cart Button -->
              <button class="relative px-10 py-3 border border-gold/20 text-gold/80 text-[10px] uppercase tracking-[0.4em] font-sans transition-all duration-700 hover:bg-gold hover:text-black hover:border-transparent overflow-hidden group/btn">
                <span class="relative z-10">Add to Cart</span>
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover/btn:animate-shimmer"></div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
